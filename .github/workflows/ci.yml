name: CI

on:
  push:
    branches: [main]
  pull_request:

# Checking out and running tests needs nothing else. Without this the job
# inherits the repository default, which can be read/write on every scope.
permissions:
  contents: read

jobs:
  test:
    # Both platforms on purpose: file discovery and path handling differ
    # between them, and a .MD file matching on one but not the other is
    # exactly the kind of bug that only a matrix catches.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v7

      # Pinned to a full version on purpose: setup-uv stopped publishing
      # floating major tags after v7, so @v8 and @v9 do not resolve.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install project and locked dev dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q
