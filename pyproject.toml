[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "md2html"
version = "0.1.0"
description = "Convert Markdown to self-contained HTML with themes and syntax highlighting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "md2html" }]
keywords = ["markdown", "html", "converter", "cli", "static-site"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "markdown-it-py[linkify]>=3.0.0",
    "mdit-py-plugins>=0.4.0",
    "Pygments>=2.17.0",
    "watchdog>=4.0.0",
]

[project.scripts]
md2html = "md2html.cli:main"

[project.urls]
Homepage = "https://github.com/navara/md2html"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "build>=1.2",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
md2html = ["templates/*.html", "templates/*.css"]

[tool.ruff]
line-length = 90
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",
    "F",    # pyflakes
    "I",    # import order
    "UP",   # constructs superseded by the 3.10 floor
    "B",    # bugbear
    "SIM",  # simplifications
    "BLE",  # blind except: the CLI has one, deliberately, with a noqa
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers on purpose, and import them locally so a
# broken import fails one test rather than collection.
"tests/*" = ["PLC0415"]
