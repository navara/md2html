[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "md2html"
version = "0.2.0"
description = "Convert Markdown to self-contained HTML with themes and syntax highlighting"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "md2html" }]
keywords = ["markdown", "html", "converter", "cli", "static-site"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "markdown-it-py[linkify]>=4.3.0",
    "mdit-py-plugins>=0.7.0",
    "Pygments>=2.21.0",
    # watchdog 7 dropped Python 3.10; take the newest each interpreter can run.
    "watchdog>=6.0.0; python_version < '3.11'",
    "watchdog>=7.1.0; python_version >= '3.11'",
]

[project.scripts]
md2html = "md2html.cli:main"

[project.urls]
Homepage = "https://github.com/navara/md2html"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "build>=1.6.1",
    "ruff>=0.17.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
md2html = ["templates/*.html", "templates/*.css"]

[tool.ruff]
line-length = 90
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",
    "F",    # pyflakes
    "I",    # import order
    "UP",   # constructs superseded by the 3.10 floor
    "B",    # bugbear
    "SIM",  # simplifications
    "BLE",  # blind except: the CLI has one, deliberately, with a noqa
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers on purpose, and import them locally so a
# broken import fails one test rather than collection.
"tests/*" = ["PLC0415"]
